<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#208AEF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5FBF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  
  <!-- Glow Effect -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="url(#glowGradient)" stroke-width="80" opacity="0.6"/>
  
  <!-- Calendar Card -->
  <g transform="translate(150, 150)">
    <!-- Card Shadow -->
    <rect x="0" y="0" width="724" height="724" rx="60" fill="#000000" opacity="0.2" filter="blur(20px)"/>
    
    <!-- Card Background -->
    <rect x="0" y="0" width="724" height="724" rx="60" fill="#FFFFFF"/>
    
    <!-- Calendar Header (Days of Week) -->
    <rect x="0" y="0" width="724" height="120" rx="60" fill="#208AEF"/>
    
    <!-- Month/Year Text -->
    <text x="362" y="80" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif">
      August 2026
    </text>
    
    <!-- Calendar Grid -->
    <g stroke="#E0E1E6" stroke-width="2">
      <!-- Vertical lines -->
      <line x1="103.43" y1="140" x2="103.43" y2="724" opacity="0.3"/>
      <line x1="206.86" y1="140" x2="206.86" y2="724" opacity="0.3"/>
      <line x1="310.29" y1="140" x2="310.29" y2="724" opacity="0.3"/>
      <line x1="413.71" y1="140" x2="413.71" y2="724" opacity="0.3"/>
      <line x1="517.14" y1="140" x2="517.14" y2="724" opacity="0.3"/>
      <line x1="620.57" y1="140" x2="620.57" y2="724" opacity="0.3"/>
      
      <!-- Horizontal lines -->
      <line x1="0" y1="239.43" x2="724" y2="239.43" opacity="0.3"/>
      <line x1="0" y1="338.86" x2="724" y2="338.86" opacity="0.3"/>
      <line x1="0" y1="438.29" x2="724" y2="438.29" opacity="0.3"/>
      <line x1="0" y1="537.71" x2="724" y2="537.71" opacity="0.3"/>
      <line x1="0" y1="637.14" x2="724" y2="637.14" opacity="0.3"/>
    </g>
    
    <!-- Day numbers -->
    <g font-size="32" font-weight="600" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif">
      <!-- Row 1 -->
      <text x="51.72" y="200">1</text>
      <text x="155.14" y="200">2</text>
      <text x="258.57" y="200">3</text>
      <text x="362" y="200">4</text>
      <text x="465.43" y="200">5</text>
      <text x="568.86" y="200">6</text>
      <text x="672.29" y="200">7</text>
      
      <!-- Row 2 -->
      <text x="51.72" y="299.43">8</text>
      <text x="155.14" y="299.43">9</text>
      <text x="258.57" y="299.43">10</text>
      <text x="362" y="299.43">11</text>
      <text x="465.43" y="299.43">12</text>
      <text x="568.86" y="299.43">13</text>
      <text x="672.29" y="299.43" fill="#208AEF">14</text>
      
      <!-- Row 3 -->
      <text x="51.72" y="398.86">15</text>
      <text x="155.14" y="398.86">16</text>
      <text x="258.57" y="398.86">17</text>
      <text x="362" y="398.86">18</text>
      <text x="465.43" y="398.86">19</text>
      <text x="568.86" y="398.86">20</text>
      <text x="672.29" y="398.86">21</text>
      
      <!-- Row 4 -->
      <text x="51.72" y="498.29">22</text>
      <text x="155.14" y="498.29">23</text>
      <text x="258.57" y="498.29">24</text>
      <text x="362" y="498.29">25</text>
      <text x="465.43" y="498.29">26</text>
      <text x="568.86" y="498.29">27</text>
      <text x="672.29" y="498.29">28</text>
      
      <!-- Row 5 -->
      <text x="51.72" y="597.71">29</text>
      <text x="155.14" y="597.71">30</text>
      <text x="258.57" y="597.71">31</text>
    </g>
    
    <!-- Highlight for today (16th) -->
    <circle cx="155.14" cy="578.86" r="35" fill="#208AEF" opacity="0.2"/>
    <circle cx="155.14" cy="578.86" r="35" fill="none" stroke="#208AEF" stroke-width="3"/>
    
    <!-- Checkmark on today -->
    <g transform="translate(155.14, 578.86)">
      <path d="M -10 0 L -2 8 L 12 -6" stroke="#208AEF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
